<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Dashboard | $10M Target</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #15151f;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.3);
            --danger: #ef4444;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-2: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.live { background: var(--success); }
        .status-dot.warning { background: var(--warning); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .last-update {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Main Progress */
        .main-progress {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .main-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1.5rem;
        }

        .progress-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .progress-value {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
        }

        .progress-target {
            text-align: right;
        }

        .target-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .target-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }

        .progress-bar-container {
            background: var(--bg-tertiary);
            border-radius: 1rem;
            height: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--gradient-1);
            border-radius: 1rem;
            transition: width 1s ease-out;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .card-count {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 1rem;
            color: var(--text-secondary);
        }

        /* Task Lists */
        .task-list {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
        }

        .task-list::-webkit-scrollbar {
            width: 4px;
        }

        .task-list::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 2px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.875rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: var(--bg-tertiary);
        }

        .task-check {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-check.completed {
            background: var(--success);
            border-color: var(--success);
        }

        .task-check.completed svg {
            width: 12px;
            height: 12px;
            stroke: white;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            word-break: break-word;
        }

        .task-item.completed .task-text {
            color: var(--text-secondary);
        }

        .task-timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.25rem;
        }

        /* Milestones */
        .milestone-list {
            list-style: none;
        }

        .milestone-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            background: var(--bg-tertiary);
        }

        .milestone-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .milestone-icon.completed { background: var(--success-glow); }
        .milestone-icon.in-progress { background: var(--warning-glow); }
        .milestone-icon.pending { background: rgba(96, 96, 112, 0.3); }

        .milestone-info {
            flex: 1;
        }

        .milestone-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .milestone-value {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .milestone-progress {
            width: 60px;
            text-align: right;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .milestone-progress.completed { color: var(--success); }
        .milestone-progress.in-progress { color: var(--warning); }
        .milestone-progress.pending { color: var(--text-muted); }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .metric-card {
            background: var(--bg-tertiary);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .metric-target {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }

        .refresh-timer {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-radius: 2rem;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--text-muted);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.75rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; text-align: center; }
            .header-meta { flex-direction: column; gap: 0.75rem; }
            .grid { grid-template-columns: 1fr; }
            .progress-value { font-size: 3rem; }
            .progress-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .progress-target { text-align: left; }
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>🎯 Mission Dashboard</h1>
            <div class="header-meta">
                <div class="status-badge">
                    <span class="status-dot live"></span>
                    <span id="statusText">Live</span>
                </div>
                <div class="last-update">
                    Updated: <span id="lastUpdate">--</span>
                </div>
            </div>
        </header>

        <section class="main-progress">
            <div class="progress-header">
                <div>
                    <div class="progress-title">Progress to Goal</div>
                    <div class="progress-value"><span id="progressPercent">0</span>%</div>
                </div>
                <div class="progress-target">
                    <div class="target-label">Target Valuation</div>
                    <div class="target-value" id="targetValue">$10,000,000</div>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
        </section>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Completed Tasks
                    </h2>
                    <span class="card-count" id="completedCount">0</span>
                </div>
                <ul class="task-list" id="completedTasks">
                    <li class="loading"><div class="spinner"></div> Loading...</li>
                </ul>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Active Tasks
                    </h2>
                    <span class="card-count" id="activeCount">0</span>
                </div>
                <ul class="task-list" id="activeTasks">
                    <li class="loading"><div class="spinner"></div> Loading...</li>
                </ul>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 20V10"/>
                            <path d="M12 20V4"/>
                            <path d="M6 20v-6"/>
                        </svg>
                        Milestones
                    </h2>
                </div>
                <ul class="milestone-list" id="milestones">
                    <li class="loading"><div class="spinner"></div> Loading...</li>
                </ul>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 21H4.6A2.6 2.6 0 0 1 2 18.4V3"/>
                            <path d="m7 14 4-4 4 4 6-6"/>
                        </svg>
                        Key Metrics
                    </h2>
                </div>
                <div class="metrics-grid" id="metrics">
                    <div class="loading"><div class="spinner"></div> Loading...</div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Mission Dashboard • Tracking progress to $10M valuation</p>
            <div class="refresh-timer">
                🔄 Next refresh in <span id="countdown">60</span>s
            </div>
        </footer>
    </div>

    <script>
        // Configuration
        const STATUS_URL = 'https://raw.githubusercontent.com/bob56565/monitor-dashboard/main/STATUS.md';
        const REFRESH_INTERVAL = 60; // seconds

        let countdown = REFRESH_INTERVAL;

        // Parse STATUS.md content
        function parseStatus(content) {
            const data = {
                progress: 0,
                target: '$10,000,000',
                status: 'In Progress',
                completedTasks: [],
                activeTasks: [],
                milestones: [],
                metrics: [],
                lastUpdated: null
            };

            // Extract progress percentage
            const progressMatch = content.match(/\*\*Current Progress:\*\*\s*([\d.]+)%/);
            if (progressMatch) {
                data.progress = parseFloat(progressMatch[1]);
            }

            // Extract status
            const statusMatch = content.match(/\*\*Status:\*\*\s*([^\n]+)/);
            if (statusMatch) {
                data.status = statusMatch[1].replace(/[🟢🟡🔴⚪]/g, '').trim();
            }

            // Extract completed tasks
            const completedSection = content.match(/## Completed Tasks\s*([\s\S]*?)(?=\n##|$)/);
            if (completedSection) {
                const taskRegex = /- \[x\]\s*\*\*([^*]+)\*\*\s*-\s*(.+)/g;
                let match;
                while ((match = taskRegex.exec(completedSection[1])) !== null) {
                    data.completedTasks.push({
                        timestamp: match[1].trim(),
                        text: match[2].trim()
                    });
                }
            }

            // Extract active tasks
            const activeSection = content.match(/## Active Tasks\s*([\s\S]*?)(?=\n##|$)/);
            if (activeSection) {
                const taskRegex = /- \[ \]\s*(.+)/g;
                let match;
                while ((match = taskRegex.exec(activeSection[1])) !== null) {
                    data.activeTasks.push({
                        text: match[1].trim()
                    });
                }
            }

            // Extract milestones
            const milestoneSection = content.match(/## Milestones\s*([\s\S]*?)(?=\n##|$)/);
            if (milestoneSection) {
                const lines = milestoneSection[1].split('\n').filter(l => l.startsWith('|') && !l.includes('---') && !l.includes('Milestone'));
                lines.forEach(line => {
                    const parts = line.split('|').map(p => p.trim()).filter(p => p);
                    if (parts.length >= 4) {
                        const statusEmoji = parts[2];
                        let status = 'pending';
                        if (statusEmoji.includes('🟢')) status = 'completed';
                        else if (statusEmoji.includes('🟡')) status = 'in-progress';
                        
                        data.milestones.push({
                            name: parts[0],
                            value: parts[1],
                            status: status,
                            progress: parts[3]
                        });
                    }
                });
            }

            // Extract metrics
            const metricsSection = content.match(/## Key Metrics\s*([\s\S]*?)(?=\n##|$)/);
            if (metricsSection) {
                const lines = metricsSection[1].split('\n').filter(l => l.startsWith('|') && !l.includes('---') && !l.includes('Metric'));
                lines.forEach(line => {
                    const parts = line.split('|').map(p => p.trim()).filter(p => p);
                    if (parts.length >= 3) {
                        data.metrics.push({
                            label: parts[0],
                            current: parts[1],
                            target: parts[2]
                        });
                    }
                });
            }

            // Extract last updated
            const updatedMatch = content.match(/\*Last updated:\s*([^*]+)\*/);
            if (updatedMatch) {
                data.lastUpdated = updatedMatch[1].trim();
            }

            return data;
        }

        // Render functions
        function renderProgress(data) {
            document.getElementById('progressPercent').textContent = data.progress.toFixed(1);
            document.getElementById('progressBar').style.width = `${Math.min(data.progress, 100)}%`;
            document.getElementById('statusText').textContent = data.status;
            if (data.lastUpdated) {
                document.getElementById('lastUpdate').textContent = data.lastUpdated;
            }
        }

        function renderCompletedTasks(tasks) {
            const container = document.getElementById('completedTasks');
            document.getElementById('completedCount').textContent = tasks.length;
            
            if (tasks.length === 0) {
                container.innerHTML = '<li class="task-item"><span style="color: var(--text-muted)">No completed tasks yet</span></li>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <li class="task-item completed">
                    <div class="task-check completed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-timestamp">${escapeHtml(task.timestamp)}</div>
                    </div>
                </li>
            `).join('');
        }

        function renderActiveTasks(tasks) {
            const container = document.getElementById('activeTasks');
            document.getElementById('activeCount').textContent = tasks.length;
            
            if (tasks.length === 0) {
                container.innerHTML = '<li class="task-item"><span style="color: var(--text-muted)">No active tasks</span></li>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <li class="task-item">
                    <div class="task-check"></div>
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                    </div>
                </li>
            `).join('');
        }

        function renderMilestones(milestones) {
            const container = document.getElementById('milestones');
            
            if (milestones.length === 0) {
                container.innerHTML = '<li class="task-item"><span style="color: var(--text-muted)">No milestones defined</span></li>';
                return;
            }

            const icons = {
                'completed': '✅',
                'in-progress': '🔄',
                'pending': '⏳'
            };

            container.innerHTML = milestones.map(m => `
                <li class="milestone-item">
                    <div class="milestone-icon ${m.status}">${icons[m.status]}</div>
                    <div class="milestone-info">
                        <div class="milestone-name">${escapeHtml(m.name)}</div>
                        <div class="milestone-value">${escapeHtml(m.value)}</div>
                    </div>
                    <div class="milestone-progress ${m.status}">${escapeHtml(m.progress)}</div>
                </li>
            `).join('');
        }

        function renderMetrics(metrics) {
            const container = document.getElementById('metrics');
            
            if (metrics.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 2rem;">No metrics available</div>';
                return;
            }

            container.innerHTML = metrics.map(m => `
                <div class="metric-card">
                    <div class="metric-label">${escapeHtml(m.label)}</div>
                    <div class="metric-value">${escapeHtml(m.current)}</div>
                    <div class="metric-target">Target: ${escapeHtml(m.target)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Fetch and render
        async function loadStatus() {
            try {
                const response = await fetch(STATUS_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to fetch');
                
                const content = await response.text();
                const data = parseStatus(content);
                
                renderProgress(data);
                renderCompletedTasks(data.completedTasks);
                renderActiveTasks(data.activeTasks);
                renderMilestones(data.milestones);
                renderMetrics(data.metrics);
                
                document.querySelector('.status-dot').className = 'status-dot live';
            } catch (error) {
                console.error('Failed to load status:', error);
                document.querySelector('.status-dot').className = 'status-dot warning';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }

        // Countdown timer
        function updateCountdown() {
            countdown--;
            document.getElementById('countdown').textContent = countdown;
            
            if (countdown <= 0) {
                countdown = REFRESH_INTERVAL;
                loadStatus();
            }
        }

        // Initialize
        loadStatus();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
